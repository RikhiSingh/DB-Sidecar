[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/bin/sidecar",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros", "chrono", "json"] }
sqlparser = "0.47"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
parking_lot = "0.12"
dotenvy = "0.15"
utoipa = { version = "4", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
hnsw_rs = "0.1"
qdrant-client = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"] }
time = { version = "0.3", features = ["formatting"] }
either = "1.13"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
regex = "1.10"


